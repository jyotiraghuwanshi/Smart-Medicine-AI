            </a>

                Analytics
            </a>
        </li>

        <li>
            <a href="caregiver.html">

            </a>
        </li>

        <li>
            <a href="profile.html">
                <i class="fa-solid fa-user"></i>
                Profile
            </a>
        </li>

    </ul>

</div>


<!-- ================= MAIN ================= -->

<div class="main">


    <!-- ================= NAVBAR ================= -->

    <div class="navbar">

        <div>

            <h1>
                Medicines 💊
            </h1>

            <p>
                Manage all prescribed medicines
            </p>

        </div>


        <div class="nav-icons">

            <i class="fa-solid fa-bell"></i>

            <div class="profile-box">

                <i class="fa-solid fa-user-circle"></i>

                <span id="topPatientName">
                    Patient
                </span>

            </div>

        </div>

    </div>


    <!-- ================= SEARCH ================= -->

    <div class="search-box">

        <input
            type="text"
            id="medicineSearch"
            placeholder="🔍 Search medicine...">

    </div>


    <!-- ================= MEDICINE LIST ================= -->

    <div class="schedule">

        <h2>
            Medicine List
        </h2>

        <table>

            <thead>

                <tr>

                    <th>Medicine</th>
                    <th>Dosage</th>
                    <th>Time</th>
                    <th>Status</th>
                    <th>Action</th>

                </tr>

            </thead>

                    <td colspan="5">

                    </td>
                </tr>

            </tbody>

        </table>

    </div>


</div>


<script src="js/script.js"></script>


<!-- ================= FIREBASE ================= -->

<script type="module">

import { db } from "./js/firebase.js";

import {
    collection,
    getDocs,
    addDoc
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


const PATIENT_ID = "P001";


// =====================================================
// GET TODAY'S DATE
// =====================================================

function getToday() {

    const now = new Date();

    return (
        now.getFullYear() +
        "-" +
        String(now.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(now.getDate()).padStart(2, "0")
    );

}


// =====================================================
// LOAD MEDICINES
// =====================================================

async function loadMedicines() {

    const table =
        document.getElementById("medicineTableBody");


    try {

        // ---------------------------------------------
        // LOAD MEDICINES
        // ---------------------------------------------

        const medicinesSnapshot =
            await getDocs(
                collection(db, "Medicines")
            );


        // ---------------------------------------------
        // LOAD DOSE HISTORY
        // ---------------------------------------------

        const doseHistorySnapshot =
            await getDocs(
                collection(db, "Dose History")
            );


        // ---------------------------------------------
        // TODAY
        // ---------------------------------------------

        const today =
            getToday();


        // ---------------------------------------------
        // STORE TAKEN MEDICINES
        // ---------------------------------------------

        const takenMedicines =
            new Set();


        doseHistorySnapshot.forEach(
            function(doseDoc) {

                const dose =
                    doseDoc.data();


                if (
                    dose.patientId === PATIENT_ID &&
                    dose.date === today &&
                    dose.status === "TAKEN"
                ) {

                    takenMedicines.add(
                        dose.medicineId
                    );

                }

            }
        );


        table.innerHTML = "";

        let count = 0;


        // ---------------------------------------------
        // CREATE MEDICINE ROWS
        // ---------------------------------------------

        medicinesSnapshot.forEach(
            function(medicineDoc) {

                const medicine =
                    medicineDoc.data();


                if (
                    medicine.patientId !== PATIENT_ID
                ) {

                    return;

                }


                count++;


                const medicineId =
                    medicineDoc.id;


                const medicineName =
                    medicine.name ||
                    "Medicine";


                const compartment =
                    medicine.compartment ||
                    "Morning";


                let medicineTime =
                    "8:00 AM";


                if (
                    compartment === "Afternoon"
                ) {

                    medicineTime =
                        "2:00 PM";

                }

                else if (
                    compartment === "Evening"
                ) {

                    medicineTime =
                        "6:00 PM";

                }

                else if (
                    compartment === "Night"
                ) {

                    medicineTime =
                        "8:00 PM";

                }


                // -----------------------------------------
                // CHECK IF ALREADY TAKEN
                // -----------------------------------------

                const isTaken =
                    takenMedicines.has(
                        medicineId
                    );


                let statusHTML;
                let buttonHTML;


                if (isTaken) {

                    statusHTML = `
                        <span style="
                            color:green;
                            font-weight:600;
                        ">
                            ✔ Taken
                        </span>
                    `;


                    buttonHTML = `
                        <button
                            class="take-btn"
                            disabled
                        >
                            Taken
                        </button>
                    `;

                }

                else {

                    statusHTML = `
                        <span style="
                            color:orange;
                            font-weight:600;
                        ">
                            ⏰ Pending
                        </span>
                    `;


                    buttonHTML = `
                        <button
                            class="take-btn"
                            onclick="markMedicineTaken(
                                this,
                                '${medicineId}',
                                '${medicineName}',
                                '${compartment}'
                            )"
                        >
                            Take
                        </button>
                    `;

                }


                // -----------------------------------------
                // CREATE ROW
                // -----------------------------------------

                const row =
                    document.createElement("tr");


                row.innerHTML = `

                    <td>
                        ${medicineName}
                    </td>

                    <td>
                        1 Tablet
                    </td>

                    <td>
                        ${medicineTime}
                    </td>

                    <td class="medicine-status">
                        ${statusHTML}
                    </td>

                    <td>
                        ${buttonHTML}
                    </td>

                `;


                table.appendChild(row);

            }
        );


        if (count === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="5">
                        No medicines found.
                    </td>
                </tr>
            `;

        }

    }

    catch (error) {

        console.error(
            "Error loading medicines:",
            error
        );


        table.innerHTML = `
            <tr>
                <td
                    colspan="5"
                    style="color:red;"
                >
                    Unable to load medicines.
                </td>
            </tr>
        `;

    }

}



// =====================================================
// MARK MEDICINE TAKEN
// =====================================================

window.markMedicineTaken = async function(
    button,
    medicineId,
    medicineName,
    compartment
) {

    button.disabled = true;

    button.textContent =
        "Saving...";


    try {

        const now =
            new Date();


        const date =
            getToday();


        const actualTime =
            String(
                now.getHours()
            ).padStart(2, "0")
            +
            ":"
            +
            String(
                now.getMinutes()
            ).padStart(2, "0");


        let scheduledTime =
            "08:00";


        if (
            compartment === "Afternoon"
        ) {

            scheduledTime =
                "14:00";

        }

        else if (
            compartment === "Evening"
        ) {

            scheduledTime =
                "18:00";

        }

        else if (
            compartment === "Night"
        ) {

            scheduledTime =
                "20:00";

        }


        // ---------------------------------------------
        // SAVE TO DOSE HISTORY
        // ---------------------------------------------

        await addDoc(
            collection(
                db,
                "Dose History"
            ),
            {

                actualTime:
                    actualTime,

                date:
                    date,

                medicineId:
                    medicineId,

                medicineName:
                    medicineName,

                patientId:
                    PATIENT_ID,

                scheduledTime:
                    scheduledTime,

                status:
                    "TAKEN"

            }
        );


        // ---------------------------------------------
        // UPDATE SCREEN
        // ---------------------------------------------

        const row =
            button.closest("tr");


        if (row) {

            const statusCell =
                row.querySelector(
                    ".medicine-status"
                );


            if (statusCell) {

                statusCell.innerHTML = `
                    <span style="
                        color:green;
                        font-weight:600;
                    ">
                        ✔ Taken
                    </span>
                `;

            }

        }


        button.textContent =
            "Taken";


        console.log(
            "Medicine saved:",
            medicineName
        );


        alert(
            medicineName +
            " marked as Taken."
        );


        // Reload data so Firebase is the source of truth

        await loadMedicines();

    }

    catch (error) {

        console.error(
            "FIREBASE SAVE ERROR:",
            error
        );


        button.disabled =
            false;


        button.textContent =
            "Take";


        alert(
            "Unable to save medicine status.\n\n" +
            error.message
        );

    }

};


// =====================================================
// SEARCH
// =====================================================

const search =
    document.getElementById(
        "medicineSearch"
    );


search.addEventListener(
    "input",
    function() {

        const text =
            this.value
            .toLowerCase()
            .trim();


        const rows =
            document.querySelectorAll(
                "#medicineTableBody tr"
            );


        rows.forEach(
            function(row) {

                const name =
                    row.cells[0]
                    ?.textContent
                    .toLowerCase();


                row.style.display =
                    name &&
                    name.includes(text)
                        ? ""
                        : "none";

            }
        );

    }
);


// =====================================================
// START
// =====================================================

loadMedicines();

</script>


</body>
